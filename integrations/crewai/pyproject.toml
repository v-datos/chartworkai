[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chartworkai-crewai"
version = "0.1.0"
description = "CrewAI runtime evidence adapter for ChartworkAI"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
authors = [{ name = "ChartworkAI contributors" }]
keywords = ["ai-agents", "audit", "chartworkai", "crewai", "governance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "chartworkai>=0.2,<0.3",
]

[project.urls]
Homepage = "https://github.com/v-datos/chartworkai"
Repository = "https://github.com/v-datos/chartworkai"
Issues = "https://github.com/v-datos/chartworkai/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/chartworkai_crewai"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/LICENSE", "/README.md", "/pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
