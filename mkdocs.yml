site_name: ChartworkAI
site_description: Repository-native governance for agentic work.
site_url: https://v-datos.github.io/chartworkai/
repo_name: v-datos/chartworkai
repo_url: https://github.com/v-datos/chartworkai
edit_uri: edit/main/

docs_dir: website/.generated
site_dir: site
strict: true

theme:
  name: material
  language: en
  logo: assets/chartworkai_mark.png
  favicon: assets/chartworkai_mark.png
  font: false
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    scheme: default
    primary: custom
    accent: custom

nav:
  - Guide: index.md
  - Concepts:
      - Framework model: concepts.md
      - Portability: portability.md
      - Product overview: overview.md
  - Reference:
      - CLI: cli.md
      - Profiles:
          - Choose a profile: profiles/index.md
          - Generic: profiles/generic.md
          - Software app: profiles/software-app.md
          - Data science: profiles/data-science.md
          - Database: profiles/database.md
          - Competition ML: profiles/competition-ml.md
          - Investigation: profiles/investigation.md
          - Deployed service: profiles/deployed-service.md
      - Operating procedure: operating-model.md
      - Initialization: initialization.md
      - Extensions: extensions.md
  - Integrations:
      - CrewAI: integrations/crewai.md
  - Project:
      - Security: security.md
      - Contributing: contributing.md
      - Changelog: changelog.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/chartworkai.css

extra_javascript:
  - assets/javascripts/chartworkai.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/v-datos/chartworkai
      name: ChartworkAI on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/chartworkai/
      name: ChartworkAI on PyPI

copyright: Copyright &copy; 2026 ChartworkAI contributors · Apache-2.0
