<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ChartworkAI mark">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E2740"/>
      <stop offset="100%" stop-color="#071320"/>
    </linearGradient>
    <linearGradient id="mcourse" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#E0A24A"/>
      <stop offset="100%" stop-color="#F4C77B"/>
    </linearGradient>
    <pattern id="mgrid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#1E4361" stroke-width="1.5" stroke-opacity="0.6"/>
    </pattern>
    <clipPath id="round">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#mbg)"/>
    <rect width="512" height="512" fill="url(#mgrid)"/>
    <g stroke="#2A5878" stroke-opacity="0.55" stroke-width="1.5">
      <path d="M0 256H512M256 0V512"/>
    </g>

    <!-- plotted course with recorded fixes -->
    <g>
      <path d="M96 400 L176 344 L256 356 L336 246"
            fill="none" stroke="url(#mcourse)" stroke-width="15"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M336 246 L410 150" fill="none" stroke="#E0A24A" stroke-width="13"
            stroke-dasharray="26 26" stroke-linecap="round" opacity="0.8"/>

      <g fill="#0B1F33" stroke="url(#mcourse)" stroke-width="13">
        <circle cx="96" cy="400" r="21"/>
        <circle cx="176" cy="344" r="21"/>
        <circle cx="256" cy="356" r="21"/>
      </g>

      <!-- current fix -->
      <circle cx="336" cy="246" r="30" fill="#F4C77B"/>
      <circle cx="336" cy="246" r="52" fill="none" stroke="#F4C77B" stroke-width="7" opacity="0.45"/>
    </g>
  </g>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#2A5878" stroke-width="4" stroke-opacity="0.6"/>
</svg>
