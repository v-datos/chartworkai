<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="ChartworkAI — the governance layer for agentic work">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2033"/>
      <stop offset="55%" stop-color="#0A1A2B"/>
      <stop offset="100%" stop-color="#071320"/>
    </linearGradient>
    <linearGradient id="course" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#E0A24A"/>
      <stop offset="100%" stop-color="#F4C77B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#E0A24A" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#E0A24A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1C3B54" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- graticule emphasis lines, as on a nautical chart -->
  <g stroke="#26516F" stroke-opacity="0.5" stroke-width="1.25">
    <path d="M0 200H1200M0 400H1200M320 0V630M760 0V630"/>
  </g>

  <ellipse cx="905" cy="300" rx="300" ry="240" fill="url(#glow)"/>

  <!-- the plotted course: a route recorded fix by fix -->
  <g transform="translate(660,120)">
    <path d="M20 350 L110 300 L200 312 L290 218 L380 186 L455 96"
          fill="none" stroke="url(#course)" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- dead-reckoning leg: the part not yet fixed -->
    <path d="M455 96 L520 40" fill="none" stroke="#E0A24A" stroke-width="3"
          stroke-dasharray="9 9" stroke-linecap="round" opacity="0.75"/>

    <g fill="#0A1A2B" stroke="url(#course)" stroke-width="3.5">
      <circle cx="20" cy="350" r="8.5"/>
      <circle cx="110" cy="300" r="8.5"/>
      <circle cx="200" cy="312" r="8.5"/>
      <circle cx="290" cy="218" r="8.5"/>
      <circle cx="380" cy="186" r="8.5"/>
    </g>
    <!-- current fix -->
    <circle cx="455" cy="96" r="12" fill="#F4C77B"/>
    <circle cx="455" cy="96" r="21" fill="none" stroke="#F4C77B" stroke-width="2" opacity="0.5"/>
    <path d="M455 62V130M421 96H489" stroke="#F4C77B" stroke-width="1.5" opacity="0.45"/>
  </g>

  <!-- wordmark -->
  <g font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="90" y="286" font-size="76" font-weight="700" fill="#F2F6FA" letter-spacing="-1.5">
      Chartwork<tspan fill="#E0A24A">AI</tspan>
    </text>
    <text x="92" y="340" font-size="29" font-weight="500" fill="#9FB6C9">
      The governance layer for agentic work
    </text>
    <path d="M92 382H320" stroke="#26516F" stroke-width="1.5"/>
    <text x="92" y="424" font-size="20" font-weight="400" fill="#6E8AA1">
      Agent frameworks orchestrate. ChartworkAI governs.
    </text>
    <text x="92" y="470" font-size="17" font-weight="400" fill="#55708A">
      Charter · decisions · handoffs · phase gates — in the repo, not the chat.
    </text>
  </g>
</svg>
