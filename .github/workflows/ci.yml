name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          # Confirm the zero-dependency package works off-Linux too.
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: ChartworkAI governs itself (dogfood the linter)
        run: chartworkai check . --strict --self-audit

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: Shell scripts parse cleanly
        run: |
          status=0
          for script in scripts/*.sh extensions/*/*.sh; do
            [ -e "$script" ] || continue
            if sh -n "$script"; then
              echo "ok   $script"
            else
              echo "FAIL $script"
              status=1
            fi
          done
          exit $status

  artifacts:
    name: build and install the distributables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: python -m pip install --upgrade pip build twine && python -m build

      - name: Validate metadata
        run: twine check dist/*

      - name: Neither artifact may carry local clutter or secrets
        run: |
          set -eu
          # The wheel is what most people install, so inspect it too — a file can be
          # absent from the sdist and still be force-included into the wheel.
          python - <<'PY'
          import pathlib, re, sys, tarfile, zipfile

          BANNED = re.compile(
              r"(^|/)("
              r"outputs|\.claude|\.venv|venv|\.idea|\.vscode|\.git|\.pytest_cache|"
              r"\.ruff_cache|\.mypy_cache|__pycache__|node_modules|htmlcov"
              r")/"
              r"|(^|/)("
              r"\.env|\.envrc|\.netrc|\.npmrc|\.pypirc|\.DS_Store|Thumbs\.db|"
              r"\.coverage[^/]*|id_rsa|id_ed25519|.*\.pem|.*\.key|.*\.p12|.*\.pfx|"
              r".*\.orig|.*\.rej|.*\.bak|.*~"
              r")$",
              re.IGNORECASE,
          )

          def names(path):
              if path.suffix == ".whl":
                  with zipfile.ZipFile(path) as archive:
                      return archive.namelist()
              with tarfile.open(path) as archive:
                  return archive.getnames()

          bad = []
          for path in sorted(pathlib.Path("dist").iterdir()):
              for name in names(path):
                  if BANNED.search(name):
                      bad.append(f"{path.name}: {name}")

          if bad:
              for entry in bad:
                  print(f"::error::leaked into the distribution: {entry}")
              sys.exit(1)
          print("sdist and wheel are clean")
          PY

      - name: Install from the SDIST and scaffold outside the repo
        run: |
          set -eu
          python -m venv /tmp/relcheck
          /tmp/relcheck/bin/pip install dist/*.tar.gz
          cd /tmp
          /tmp/relcheck/bin/chartworkai --version
          /tmp/relcheck/bin/chartworkai init /tmp/relproj --name "Release Check" \
            --profile software-app >/dev/null
          test -f /tmp/relproj/PROJECT_CHARTER.md
          echo "a user installing from PyPI can scaffold a project"

      - name: Reject an unknown profile
        run: |
          set +e
          /tmp/relcheck/bin/chartworkai init /tmp/bogus --name X --profile nope >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" = "0" ]; then
            echo "::error::An unknown profile was accepted"
            exit 1
          fi
          echo "unknown profiles are rejected (exit $rc)"

      - name: Refuse to overwrite an existing governance layer
        run: |
          set +e
          /tmp/relcheck/bin/chartworkai init /tmp/relproj --name "Release Check" \
            --profile software-app >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" = "0" ]; then
            echo "::error::init clobbered an existing project without --force"
            exit 1
          fi
          echo "init refuses to clobber (exit $rc)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributables
          path: dist/*

  parity:
    name: shell/python parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e "."

      - name: The shell and Python scaffolds must be byte-identical
        run: |
          set -eu
          for profile in software-app data-science; do
            rm -rf "/tmp/sh_$profile" "/tmp/py_$profile"
            sh scripts/init_project_from_framework.sh "/tmp/sh_$profile" "Parity Project" \
              parity_project "$profile" >/dev/null 2>&1 || true
            chartworkai init "/tmp/py_$profile" --name "Parity Project" \
              --slug parity_project --profile "$profile" >/dev/null 2>&1 || true

            if diff -r "/tmp/sh_$profile" "/tmp/py_$profile"; then
              echo "$profile: scaffolds identical"
            else
              echo "::error::Scaffold parity broken for profile $profile"
              exit 1
            fi
          done

      - name: Bootstrap a project and compare both checkers
        run: |
          set -eu
          sh scripts/init_project_from_framework.sh /tmp/parity_proj "Parity Project" parity_proj software-app >/dev/null 2>&1 || true

          sh scripts/check_framework_compliance.sh /tmp/parity_proj >/dev/null 2>&1 && shell_rc=0 || shell_rc=$?
          chartworkai check /tmp/parity_proj >/dev/null 2>&1 && py_rc=0 || py_rc=$?

          echo "fresh scaffold  shell=$shell_rc python=$py_rc"
          if [ "$shell_rc" != "$py_rc" ]; then
            echo "::error::Parity broken on a fresh scaffold (shell=$shell_rc python=$py_rc)"
            exit 1
          fi

          # Both must agree that the framework repo itself is compliant.
          sh scripts/check_framework_compliance.sh . --self-audit >/dev/null 2>&1 && shell_rc=0 || shell_rc=$?
          chartworkai check . --self-audit >/dev/null 2>&1 && py_rc=0 || py_rc=$?
          echo "framework repo  shell=$shell_rc python=$py_rc"
          if [ "$shell_rc" != "$py_rc" ] || [ "$shell_rc" != "0" ]; then
            echo "::error::Parity broken on the framework repo (shell=$shell_rc python=$py_rc)"
            exit 1
          fi

  ci:
    # A single, stable gate for branch protection. Requiring the matrix jobs by name
    # means the protection rule silently stops covering a version whenever the matrix
    # changes — py3.10, py3.11 and py3.13 were all running but not required. This job
    # depends on every other job, so protecting one name protects all of them, and it
    # keeps working when the matrix does change.
    name: CI
    if: always()
    needs: [test, lint, artifacts, parity]
    runs-on: ubuntu-latest
    steps:
      - name: Every job must have succeeded
        run: |
          set -eu
          results="${{ join(needs.*.result, ' ') }}"
          echo "upstream results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job did not succeed ($results)"
              exit 1
            fi
          done
          echo "all jobs succeeded"
