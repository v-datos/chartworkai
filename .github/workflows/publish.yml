name: Publish

# Publishing uses PyPI Trusted Publishing (OIDC), so there is no API token stored
# in this repository. PyPI verifies the workflow's identity — repo, workflow file,
# and environment — and issues a short-lived credential for that one upload.
#
#   TestPyPI: run this workflow manually from the Actions tab.
#   PyPI:     push a tag matching chartworkai-v* (see DEC-008 on versioning).
#
# THE FILENAME IS PART OF THE SECURITY BOUNDARY. Actions runs the workflow file as
# it exists *at the tagged ref*, and a Trusted Publisher matches on the workflow
# filename — so every historical commit that contains a publishing workflow under a
# trusted name can publish, using whatever gates that old version happened to have.
# Gates added later cannot protect earlier commits. This file is therefore named
# `publish.yml`, a name that has never existed in this repository's history, and PyPI
# must trust ONLY `publish.yml`. Never grant a Trusted Publisher the name
# `release.yml`: commits carrying an ungated version of that file are still reachable.
#
# A tag is not a review. Everything CI enforces on `main` is re-run here against the
# exact commit being published, because a tag can be pushed to any commit and the
# artifact is what reaches users.

on:
  workflow_dispatch:
  push:
    tags:
      - "chartworkai-v*"

# Actions are pinned to commit SHAs, not tags. A tag is mutable: whoever controls
# the action repository can repoint `@v4` at new code, and this workflow holds an
# OIDC identity that PyPI trusts. The trailing comment records the human-readable
# version each SHA corresponds to.

permissions:
  contents: read

jobs:
  gate:
    name: Full release gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e . ruff pytest

      - name: Tests
        run: python -m pytest -q

      - name: Lint
        run: ruff check src tests && ruff format --check src tests

      - name: Compliance — Python implementation
        run: python -m chartworkai check . --strict --self-audit

      - name: Compliance — shell reference implementation
        if: runner.os != 'Windows'
        run: sh scripts/check_framework_compliance.sh . --self-audit

      - name: Shell scripts parse
        if: runner.os != 'Windows'
        run: for f in scripts/*.sh extensions/*/*.sh; do sh -n "$f" || exit 1; done

  provenance:
    name: The tag must point at the reviewed tip of main
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Refuse a tag that is not exactly the current main tip
        run: |
          set -eu
          git fetch --quiet origin main
          tip="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" != "$tip" ]; then
            echo "::error::tagged commit $GITHUB_SHA is not the tip of main ($tip)"
            echo "::error::Merely being an ancestor is not enough: an older commit carries"
            echo "::error::older workflows and older gates. Tag the reviewed tip."
            exit 1
          fi
          echo "tagged commit is the current tip of main"

  build:
    name: Build and verify the distributables
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build
        run: python -m pip install --upgrade pip build twine && python -m build

      - name: Validate metadata
        run: twine check dist/*

      - name: The tag must match the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          tag="${GITHUB_REF#refs/tags/chartworkai-v}"
          built="$(ls dist/*.tar.gz | sed -E 's/.*chartworkai-(.*)\.tar\.gz/\1/')"
          if [ "$tag" != "$built" ]; then
            echo "::error::tag chartworkai-v$tag does not match built version $built"
            exit 1
          fi
          echo "tag and package agree on $built"

      - name: Neither artifact may carry local clutter or secrets
        run: |
          set -eu
          python - <<'PY'
          import pathlib, re, sys, tarfile, zipfile

          BANNED = re.compile(
              r"(^|/)("
              r"outputs|\.claude|\.venv|venv|\.idea|\.vscode|\.git|\.pytest_cache|"
              r"\.ruff_cache|\.mypy_cache|__pycache__|node_modules|htmlcov"
              r")/"
              r"|(^|/)("
              r"\.env|\.envrc|\.netrc|\.npmrc|\.pypirc|\.DS_Store|Thumbs\.db|"
              r"\.coverage[^/]*|id_rsa|id_ed25519|.*\.pem|.*\.key|.*\.p12|.*\.pfx|"
              r".*\.orig|.*\.rej|.*\.bak|.*~"
              r")$",
              re.IGNORECASE,
          )

          def names(path):
              if path.suffix == ".whl":
                  with zipfile.ZipFile(path) as archive:
                      return archive.namelist()
              with tarfile.open(path) as archive:
                  return archive.getnames()

          bad = []
          for path in sorted(pathlib.Path("dist").iterdir()):
              for name in names(path):
                  if BANNED.search(name):
                      bad.append(f"{path.name}: {name}")

          if bad:
              for entry in bad:
                  print(f"::error::leaked into the distribution: {entry}")
              sys.exit(1)
          print("sdist and wheel are clean")
          PY

      - name: No secrets or personal identifiers in the artifact contents
        run: |
          set -eu
          python - <<'PY'
          import math, pathlib, re, sys, tarfile, zipfile
          from collections import Counter

          # Workflow logs on a public repository are public. A finding must say enough
          # to locate the problem and nothing more — printing the matched value would
          # publish the very secret this step exists to stop.
          def redact(value: bytes) -> str:
              text = value.decode("utf-8", "replace")
              if len(text) <= 8:
                  return "*" * len(text)
              return f"{text[:4]}...{text[-2:]} ({len(text)} chars)"

          CREDENTIALS = [
              ("private key block", re.compile(rb"-----BEGIN [A-Z ]*PRIVATE KEY-----")),
              ("AWS access key id", re.compile(rb"\b(?:AKIA|ASIA)[0-9A-Z]{16}\b")),
              ("GitHub token", re.compile(rb"\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36}\b")),
              ("GitHub fine-grained token", re.compile(rb"\bgithub_pat_[A-Za-z0-9_]{22,}")),
              ("OpenAI-style key", re.compile(rb"\bsk-[A-Za-z0-9_-]{20,}")),
              ("Anthropic key", re.compile(rb"\bsk-ant-[A-Za-z0-9_-]{20,}")),
              ("Slack token", re.compile(rb"\bxox[baprs]-[A-Za-z0-9-]{10,}")),
              ("Google API key", re.compile(rb"\bAIza[0-9A-Za-z_-]{35}\b")),
              ("PyPI token", re.compile(rb"\bpypi-AgEIcHlwaS5vcmc[A-Za-z0-9_-]{10,}")),
              ("JSON Web Token", re.compile(rb"\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}")),
              # Deliberately generic: the provider patterns above only catch formats
              # someone thought to enumerate. A bare `token = "..."` slipped through
              # the earlier, narrower list.
              #
              # Quotes are optional. Requiring them missed every form that does not
              # use them — `API_TOKEN=value` in a shell script or dotenv, and
              # `token: value` in YAML, which is exactly how a leaked credential
              # tends to be written.
              ("assigned secret", re.compile(
                  rb"(?i)\b[a-z0-9_.-]*"
                  rb"(?:api[_-]?key|secret|token|passwd|password|credential|"
                  rb"private[_-]?key|access[_-]?id|bearer|session[_-]?id|signature)"
                  rb"[a-z0-9_.-]*\s*[:=]\s*"
                  rb"(?:[\"']([^\"'\n]{16,}?)[\"']|([^\"'\s#][^\s#]{15,}))")),
          ]

          #: Values that name a secret rather than being one: shell and template
          #: expansions, and format placeholders.
          INDIRECTION = re.compile(rb"\$\{|\$\(|^\$|\{\{|%\(|<[A-Za-z_]+>")

          # A personal address or home directory reaching PyPI cannot be recalled.
          IDENTIFIERS = re.compile(
              rb"[\w.+-]+@(?!users\.noreply\.github\.com)"
              rb"[\w-]+\.(?:com|net|org|io|me|dev|local|internal|lan|home)"
              rb"|/Users/[a-z][a-z0-9_-]*/"
              rb"|/home/(?!runner)[a-z][a-z0-9_-]*/",
              re.IGNORECASE,
          )
          # Documented placeholders, not anybody's real account. Keep this tiny: every
          # entry is a hole in the check.
          ALLOWED = {b"noreply@anthropic.com", b"/home/user/", b"/Users/user/"}

          TEXTUAL = {".py", ".md", ".txt", ".json", ".yaml", ".yml", ".toml", ".cfg",
                     ".ini", ".sh", ".env", ".pth", ""}

          def shannon(value: bytes) -> float:
              counts = Counter(value)
              total = len(value)
              return -sum((n / total) * math.log2(n / total) for n in counts.values())

          def members(path):
              if path.suffix == ".whl":
                  with zipfile.ZipFile(path) as archive:
                      for name in archive.namelist():
                          yield name, archive.read(name)
              else:
                  with tarfile.open(path) as archive:
                      for member in archive.getmembers():
                          if member.isfile():
                              handle = archive.extractfile(member)
                              if handle:
                                  yield member.name, handle.read()

          findings = []
          for path in sorted(pathlib.Path("dist").iterdir()):
              for name, blob in members(path):
                  if pathlib.PurePosixPath(name).suffix.lower() not in TEXTUAL:
                      continue
                  for label, pattern in CREDENTIALS:
                      for match in pattern.finditer(blob):
                          # Two capture groups (quoted / unquoted); take whichever fired.
                          captured = [g for g in match.groups() if g] or [match.group(0)]
                          value = captured[0]
                          if label == "assigned secret":
                              # An indirection is not a secret: `TOKEN="${TOKEN:-}"`
                              # reads a value at runtime, it does not carry one.
                              if INDIRECTION.search(value):
                                  continue
                              # An assigned literal is only interesting if it looks
                              # random. A readable English placeholder is
                              # documentation, not a key.
                              if shannon(value) < 3.5:
                                  continue
                          findings.append(f"{path.name}: {name}: {label} {redact(value)}")
                  for hit in set(IDENTIFIERS.findall(blob)):
                      if hit not in ALLOWED:
                          findings.append(
                              f"{path.name}: {name}: personal identifier {redact(hit)}")

          if findings:
              for entry in sorted(set(findings)):
                  print(f"::error::{entry}")
              sys.exit(1)
          print("no secrets or personal identifiers in either artifact")
          PY

      - name: Install from the sdist and scaffold outside the repo
        run: |
          set -eu
          python -m venv /tmp/relcheck
          /tmp/relcheck/bin/pip install dist/*.tar.gz
          cd /tmp
          /tmp/relcheck/bin/chartworkai --version
          /tmp/relcheck/bin/chartworkai init /tmp/relproj --name "Release Check" \
            --profile software-app >/dev/null
          test -f /tmp/relproj/PROJECT_CHARTER.md
          echo "a user installing from PyPI can scaffold a project"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    # A manual dispatch can select any branch in the Actions UI. Test only the final
    # reviewed main commit; proving an arbitrary branch would not gate production.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, provenance]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
