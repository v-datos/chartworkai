name: Release

# Publishing uses PyPI Trusted Publishing (OIDC), so there is no API token stored
# in this repository. PyPI verifies the workflow's identity — repo, workflow file,
# and environment — and issues a short-lived credential for that one upload.
#
#   TestPyPI: run this workflow manually from the Actions tab.
#   PyPI:     push a tag matching chartworkai-v* (see DEC-008 on versioning).

on:
  workflow_dispatch:
  push:
    tags:
      - "chartworkai-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify the distributables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: python -m pip install --upgrade pip build twine && python -m build

      - name: Validate metadata
        run: twine check dist/*

      - name: The tag must match the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          tag="${GITHUB_REF#refs/tags/chartworkai-v}"
          built="$(ls dist/*.tar.gz | sed -E 's/.*chartworkai-(.*)\.tar\.gz/\1/')"
          if [ "$tag" != "$built" ]; then
            echo "::error::tag chartworkai-v$tag does not match built version $built"
            exit 1
          fi
          echo "tag and package agree on $built"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
